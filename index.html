<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZoneGay Chat</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Estilos rápidos tipo Grindr colorido */
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(to bottom right, #ff8a00, #e52e71);
      color: #fff;
    }
    header {
      background: rgba(0, 0, 0, 0.6);
      padding: 10px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }
    #chat-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #user-list {
      background: rgba(255, 255, 255, 0.1);
      padding: 5px;
      overflow-x: auto;
      white-space: nowrap;
    }
    .user {
      display: inline-block;
      margin-right: 10px;
      text-align: center;
    }
    .user img {
      border-radius: 50%;
      width: 40px;
      height: 40px;
      border: 2px solid #fff;
    }
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
    .message {
      background: rgba(255, 255, 255, 0.2);
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 10px;
      max-width: 80%;
    }
    .me {
      align-self: flex-end;
      background: rgba(0, 0, 0, 0.4);
    }
    form {
      display: flex;
      padding: 10px;
      background: rgba(0, 0, 0, 0.6);
    }
    form input {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
    }
    form button {
      background: #fff;
      border: none;
      padding: 10px;
      margin-left: 5px;
      border-radius: 10px;
      font-weight: bold;
    }
    #audio-preview {
      width: 100%;
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <div id="chat-container">
    <header>ZoneGay</header>

    <div id="user-list">
      <!-- Avatares automáticos -->
      <div class="user">
        <img src="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=User1" alt="User1">
        <div>User1</div>
      </div>
      <div class="user">
        <img src="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=User2" alt="User2">
        <div>User2</div>
      </div>
    </div>

    <div id="chat-box">
      <!-- Mensajes -->
    </div>

    <form id="message-form">
      <input type="text" id="message-input" placeholder="Escribe algo sexy...">
      <button type="submit">Enviar</button>
    </form>

    <button id="record-btn">🎙️ Grabar Audio</button>
    <audio id="audio-preview" controls hidden></audio>
    <button id="send-audio" hidden>Enviar Audio</button>
    <button id="cancel-audio" hidden>Cancelar</button>
  </div>

  <script>
    const chatBox = document.getElementById('chat-box');
    const form = document.getElementById('message-form');
    const input = document.getElementById('message-input');
    const sound = new Audio('https://notificationsounds.com/storage/sounds/file-sounds-1153-pristine.mp3');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const msg = input.value.trim();
      if (msg) {
        const div = document.createElement('div');
        div.className = 'message me';
        div.textContent = msg;
        chatBox.appendChild(div);
        input.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;
        sound.play();
      }
    });

    // Grabación de audio
    let mediaRecorder, audioChunks = [];

    const recordBtn = document.getElementById('record-btn');
    const audioPreview = document.getElementById('audio-preview');
    const sendAudioBtn = document.getElementById('send-audio');
    const cancelAudioBtn = document.getElementById('cancel-audio');

    recordBtn.addEventListener('click', async () => {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks);
        const audioUrl = URL.createObjectURL(audioBlob);
        audioPreview.src = audioUrl;
        audioPreview.hidden = false;
        sendAudioBtn.hidden = false;
        cancelAudioBtn.hidden = false;
      };

      mediaRecorder.start();
      recordBtn.textContent = 'Grabando...';
      setTimeout(() => {
        mediaRecorder.stop();
        recordBtn.textContent = '🎙️ Grabar Audio';
      }, 5000); // Máximo 5 segundos
    });

    sendAudioBtn.addEventListener('click', () => {
      const div = document.createElement('div');
      div.className = 'message me';
      const audio = document.createElement('audio');
      audio.controls = true;
      audio.src = audioPreview.src;
      div.appendChild(audio);
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      audioPreview.hidden = true;
      sendAudioBtn.hidden = true;
      cancelAudioBtn.hidden = true;
      sound.play();
    });

    cancelAudioBtn.addEventListener('click', () => {
      audioPreview.hidden = true;
      sendAudioBtn.hidden = true;
      cancelAudioBtn.hidden = true;
    });
  </script>
</body>
</html>

  </style>
</head>
<body>
  <div class="container">
    <div class="welcome-screen">
      <div class="logo">
        <img src="logo.png" alt="ZoneGay Logo">
      </div>
      <h2>¡Bienvenido a ZoneGay!</h2>
      <input type="text" id="username" placeholder="Tu nombre">
      <button onclick="startChat()">Entrar al chat</button>
    </div><div class="chat-wrapper" style="display:none">
  <div class="user-list" id="userList"></div>
  <div class="chat-container">
    <div id="chat"></div>
    <div class="input-area">
      <input type="text" id="message" placeholder="Escribe tu mensaje...">
      <button class="send" onclick="sendMessage()">Enviar</button>
      <button class="record" onclick="recordAudio()">Audio</button>
    </div>
    <div class="private-chat-container" id="privateChats"></div>
  </div>
</div>

  </div>  <script>
    const welcomeScreen = document.querySelector('.welcome-screen');
    const chatWrapper = document.querySelector('.chat-wrapper');
    const chatBox = document.getElementById('chat');
    const userList = document.getElementById('userList');
    const privateChats = document.getElementById('privateChats');
    let username = "";

    function startChat() {
      username = document.getElementById('username').value.trim();
      if (!username) return alert("Pon tu nombre");
      welcomeScreen.style.display = 'none';
      chatWrapper.style.display = 'flex';
      loadUsers();
    }

    function sendMessage() {
      const input = document.getElementById('message');
      const text = input.value.trim();
      if (!text) return;
      const message = document.createElement('div');
      message.className = 'message';
      message.innerHTML = `<div class="content"><strong>${username}</strong><br>${text}</div>`;
      chatBox.appendChild(message);
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function recordAudio() {
      alert("Grabación de audio próximamente");
    }

    function loadUsers() {
      const fakeUsers = ["Leo", "Juan", "Álvaro", "Nico", "Alex", "Mario"];
      const allUsers = [{ name: username }, ...fakeUsers.map(name => ({ name }))];
      userList.innerHTML = '<h4>Conectados</h4>';
      allUsers.forEach(user => {
        const avatarSeed = encodeURIComponent(user.name);
        const div = document.createElement('div');
        div.className = 'user';
        div.onclick = () => openPrivateChat(user.name);
        div.innerHTML = `
          <img src="https://api.dicebear.com/6.x/lorelei/svg?seed=${avatarSeed}">
          <span>${user.name}</span>
        `;
        userList.appendChild(div);
      });
    }

    function openPrivateChat(target) {
      if (target === username) return;
      let existing = document.getElementById(`chat-${target}`);
      if (!existing) {
        const chatBox = document.createElement('div');
        chatBox.className = 'private-chat-box';
        chatBox.id = `chat-${target}`;
        chatBox.innerHTML = `
          <h4>Chat con ${target}</h4>
          <div class="private-chat" id="private-messages-${target}"></div>
          <div class="input-area">
            <input type="text" id="input-${target}" placeholder="Mensaje privado...">
            <button class="send" onclick="sendPrivateMessage('${target}')">Enviar</button>
          </div>
        `;
        privateChats.appendChild(chatBox);
      }
    }

    function sendPrivateMessage(target) {
      const input = document.getElementById(`input-${target}`);
      const text = input.value.trim();
      if (!text) return;
      const container = document.getElementById(`private-messages-${target}`);
      const msg = document.createElement('div');
      msg.className = 'message';
      msg.innerHTML = `<div class="content"><strong>${username}</strong><br>${text}</div>`;
      container.appendChild(msg);
      input.value = '';
      container.scrollTop = container.scrollHeight;
    }
  </script></body>
</html>
