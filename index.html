<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ZoneGay Chat</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: #111;
      color: #fff;
    }
    header {
      background: #ff9800;
      color: #000;
      padding: 15px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      position: relative;
    }
    header img.symbol {
      position: absolute;
      right: 15px;
      top: 10px;
      width: 30px;
      height: 30px;
    }
    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #000;
    }
    #login-screen input {
      padding: 10px;
      border: none;
      border-radius: 10px;
      margin: 10px 0;
      width: 70%;
    }
    #login-screen button {
      padding: 10px 20px;
      background: #ff9800;
      color: #000;
      border: none;
      border-radius: 10px;
      font-weight: bold;
    }
    #chat-container {
      display: none;
      flex-direction: column;
      height: 100vh;
    }
    #user-list {
      background: #222;
      padding: 5px;
      overflow-x: auto;
      white-space: nowrap;
    }
    .user {
      display: inline-block;
      margin-right: 10px;
      text-align: center;
    }
    .user img {
      border-radius: 50%;
      width: 40px;
      height: 40px;
      border: 2px solid #ff9800;
    }
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      background: #111;
    }
    .message {
      background: #333;
      color: #fff;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 10px;
      max-width: 80%;
    }
    .me {
      align-self: flex-end;
      background: #ff9800;
      color: #000;
    }
    form {
      display: flex;
      padding: 10px;
      background: #000;
    }
    form input {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: #333;
      color: #fff;
    }
    form button {
      background: #ff9800;
      border: none;
      padding: 10px;
      margin-left: 5px;
      border-radius: 10px;
      font-weight: bold;
      color: #000;
    }
    #audio-preview {
      width: 100%;
      margin: 5px 0;
    }
    button {
      margin: 5px;
    }
  </style>
</head>
<body>

  <!-- Pantalla de inicio -->
  <div id="login-screen">
    <h2>Bienvenido a ZoneGay</h2>
    <input type="text" id="username" placeholder="Escribe tu nombre">
    <button onclick="startChat()">Entrar al chat</button>
  </div>

  <!-- Chat principal -->
  <div id="chat-container">
    <header>
      ZoneGay
      <!-- Aquí puedes poner tu símbolo personal -->
      <img class="symbol" src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/Transgender_Pride_flag.svg/48px-Transgender_Pride_flag.svg.png" alt="Símbolo">
    </header>

    <div id="user-list"></div>
    <div id="chat-box"></div>

    <form id="message-form">
      <input type="text" id="message-input" placeholder="Escribe algo sexy...">
      <button type="submit">Enviar</button>
    </form>

    <button id="record-btn">🎙️ Grabar Audio</button>
    <audio id="audio-preview" controls hidden></audio>
    <button id="send-audio" hidden>Enviar Audio</button>
    <button id="cancel-audio" hidden>Cancelar</button>
  </div>

  <script>
    let userName = "";
    const chatBox = document.getElementById('chat-box');
    const form = document.getElementById('message-form');
    const input = document.getElementById('message-input');
    const sound = new Audio('https://notificationsounds.com/storage/sounds/file-sounds-1153-pristine.mp3');

    function startChat() {
      const name = document.getElementById('username').value.trim();
      if (name) {
        userName = name;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('chat-container').style.display = 'flex';

        const userList = document.getElementById('user-list');
        const userDiv = document.createElement('div');
        userDiv.className = 'user';
        userDiv.innerHTML = `
          <img src="https://api.dicebear.com/7.x/bottts-neutral/svg?seed=${name}" alt="${name}">
          <div>${name}</div>
        `;
        userList.appendChild(userDiv);
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const msg = input.value.trim();
      if (msg) {
        const div = document.createElement('div');
        div.className = 'message me';
        div.textContent = `${userName}: ${msg}`;
        chatBox.appendChild(div);
        input.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;
        sound.play();
      }
    });

    // Grabación de audio
    let mediaRecorder, audioChunks = [];
    const recordBtn = document.getElementById('record-btn');
    const audioPreview = document.getElementById('audio-preview');
    const sendAudioBtn = document.getElementById('send-audio');
    const cancelAudioBtn = document.getElementById('cancel-audio');

    recordBtn.addEventListener('click', async () => {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks);
        const audioUrl = URL.createObjectURL(audioBlob);
        audioPreview.src = audioUrl;
        audioPreview.hidden = false;
        sendAudioBtn.hidden = false;
        cancelAudioBtn.hidden = false;
      };

      mediaRecorder.start();
      recordBtn.textContent = 'Grabando...';
      setTimeout(() => {
        mediaRecorder.stop();
        recordBtn.textContent = '🎙️ Grabar Audio';
      }, 5000); // 5 segundos
    });

    sendAudioBtn.addEventListener('click', () => {
      const div = document.createElement('div');
      div.className = 'message me';
      const audio = document.createElement('audio');
      audio.controls = true;
      audio.src = audioPreview.src;
      div.appendChild(document.createTextNode(`${userName}: `));
      div.appendChild(audio);
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      audioPreview.hidden = true;
      sendAudioBtn.hidden = true;
      cancelAudioBtn.hidden = true;
      sound.play();
    });

    cancelAudioBtn.addEventListener('click', () => {
      audioPreview.hidden = true;
      sendAudioBtn.hidden = true;
      cancelAudioBtn.hidden = true;
    });
  </script>
</body>
</html>
